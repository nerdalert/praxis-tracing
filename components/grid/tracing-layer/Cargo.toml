[package]
name = "tracing-layer"
description = "Reusable web-framework tracing layer — W3C propagation, SERVER/CLIENT spans, routing events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
# HTTP types
http = { workspace = true }

# Tracing (always available — no-op subscriber when otel is off)
tracing = { workspace = true }

# OpenTelemetry (feature-gated)
opentelemetry = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.29", optional = true }
tracing-opentelemetry = { version = "0.30", optional = true }

# Serialization (for routing event attributes)
serde = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
hyper = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "test-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio", "testing"] }
tracing-opentelemetry = "0.30"
tracing-subscriber = { workspace = true }

[lints]
workspace = true
