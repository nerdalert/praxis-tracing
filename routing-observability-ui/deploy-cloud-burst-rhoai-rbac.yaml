apiVersion: v1
kind: ServiceAccount
metadata:
  name: praxis-tracing-cloud-burst-ui
  namespace: praxis-tracing-cloud-burst
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: praxis-tracing-cloud-burst-ui
  namespace: grid-system
rules:
  - apiGroups: [""]
    resources: [configmaps, pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [patch, update]
  - apiGroups: ["apps"]
    resources: [deployments, deployments/scale]
    verbs: [get, patch, update]
  - apiGroups: ["grid.praxis-proxy.io"]
    resources: [inferenceproviders, gridnetworks]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praxis-tracing-cloud-burst-ui
  namespace: grid-system
subjects:
  - kind: ServiceAccount
    name: praxis-tracing-cloud-burst-ui
    namespace: praxis-tracing-cloud-burst
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: praxis-tracing-cloud-burst-ui
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: praxis-tracing-cloud-burst-ui
  namespace: grid-cloud-burst-rhoai
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: praxis-tracing-cloud-burst-ui
  namespace: grid-cloud-burst-rhoai
subjects:
  - kind: ServiceAccount
    name: praxis-tracing-cloud-burst-ui
    namespace: praxis-tracing-cloud-burst
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: praxis-tracing-cloud-burst-ui
