name: Cloud-burst tracing UI

on:
  pull_request:
    paths:
      - 'grid-cloud-burst/routing-observability-ui/**'
      - '.github/workflows/cloud-burst-ui.yml'
  push:
    paths:
      - 'grid-cloud-burst/routing-observability-ui/**'
      - '.github/workflows/cloud-burst-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: grid-cloud-burst/routing-observability-ui

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: grid-cloud-burst/routing-observability-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API and unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-burst-ui-playwright-report
          path: |
            grid-cloud-burst/routing-observability-ui/playwright-report
            grid-cloud-burst/routing-observability-ui/test-results
          if-no-files-found: ignore
