apiVersion: v1
kind: Namespace
metadata:
  name: praxis-tracing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-otel-collector
  namespace: praxis-tracing
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
      batch:
        timeout: 1s
        send_batch_size: 128
    exporters:
      zipkin/jaeger:
        endpoint: http://jaeger.praxis-tracing.svc.cluster.local:9411/api/v2/spans
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [zipkin/jaeger]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: praxis-tracing
  labels:
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1
          imagePullPolicy: IfNotPresent
          args:
            - --collector.zipkin.host-port=:9411
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: COLLECTOR_ZIPKIN_HOST_PORT
              value: "9411"
          ports:
            - name: query
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: jaeger-grpc
              containerPort: 14250
            - name: zipkin
              containerPort: 9411
          readinessProbe:
            httpGet:
              path: /
              port: 14269
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 14269
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: praxis-tracing
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
    - name: admin
      port: 14269
      targetPort: 14269
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
    - name: zipkin
      port: 9411
      targetPort: 9411
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-otel-collector
  namespace: praxis-tracing
  labels:
    app.kubernetes.io/name: praxis-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: praxis-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: praxis-otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.115.1
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-otel-collector
  namespace: praxis-tracing
spec:
  selector:
    app.kubernetes.io/name: praxis-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
