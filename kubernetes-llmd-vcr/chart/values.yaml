replicaCount: 2

image:
  repository: ghcr.io/neuralmagic/vllm-vcr
  tag: vllm0.23
  pullPolicy: IfNotPresent

model: Qwen/Qwen3-0.6B
poolName: pool
serviceName: vcr-service

vcr:
  maxNumSeqs: "4"
  kvCacheSize: "64"
  tokensPerBlock: "16"
  maxModelLen: "512"
  ttftMs: "50"
  itlMs: "20"
  timeFactorUnderLoad: "2.0"

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 2Gi
